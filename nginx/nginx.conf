user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    server_tokens off;

    client_max_body_size 20m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/javascript application/yaml application/x-yaml application/octet-stream image/svg+xml;
    gzip_min_length 1024;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;

    resolver 127.0.0.11 valid=30s;

    # ─── HTTP: всё → 301 на HTTPS ───────────────────────────────
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;

        # Health-check (без редиректа, для docker healthcheck)
        location = /healthz {
            access_log off;
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }

        # Все остальные запросы (включая /scan/, старые QR на http://) → HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ─── HTTPS: основной вход ────────────────────────────────────
    server {
        listen 443 ssl default_server;
        listen [::]:443 ssl default_server;
        http2 on;
        server_name _;

        ssl_certificate     /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;

        # ── Swagger UI и его статика (api-gateway) ─────────────
        # Точные пути ставим ВЫШЕ общего "location /", иначе они уходят в SPA.
        location = /swagger-ui.html {
            proxy_pass http://api-gateway:8080;
        }
        location = /openapi.yaml {
            proxy_pass http://api-gateway:8080;
        }
        location /swagger-ui/ {
            proxy_pass http://api-gateway:8080;
        }
        location /swagger/ {
            proxy_pass http://api-gateway:8080;
        }
        location /webjars/ {
            proxy_pass http://api-gateway:8080;
        }
        location /v3/api-docs {
            proxy_pass http://api-gateway:8080;
        }

        # ── WebSocket-спека (статика api-gateway) ──────────────
        location = /websocket-docs.html {
            proxy_pass http://api-gateway:8080;
        }
        location = /asyncapi.yaml {
            proxy_pass http://api-gateway:8080;
        }

        # ── REST API ───────────────────────────────────────────
        location /api/ {
            proxy_pass http://api-gateway:8080;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }

        # ── WebSocket уведомления ─────────────────────────────
        # /ws       — STOMP-over-WebSocket с SockJS-fallback (для веб-клиента)
        # /ws-native — чистый STOMP-over-WebSocket без SockJS (для нативных мобильных клиентов)
        # Проксируем напрямую в notification-service, минуя api-gateway, чтобы не тратиться
        # на текстовое перепаковывание кадров и переговоры по Sec-WebSocket-Protocol.
        location /ws-native {
            proxy_pass http://notification-service:8085;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        location /ws {
            proxy_pass http://notification-service:8085;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # ── Health-check ──────────────────────────────────────
        location = /healthz {
            access_log off;
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }

        # ── SPA (включая /scan/{token} — client-side routing) ──
        # Всё остальное (/, /scan/..., и т.д.) → web-app, который через
        # try_files отдаёт index.html, а SPA сама роутит /scan/{token}.
        location / {
            proxy_pass http://web-app:80;
        }
    }
}
