<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RetailHub — Вызов консультанта</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
        rel="stylesheet" />
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #181926;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            padding: 1rem;
        }

        .card {
            background: #2a2a3b;
            border-radius: 24px;
            padding: 2.5rem 2rem;
            max-width: 420px;
            width: 100%;
            box-shadow: 0 16px 48px rgba(0, 0, 0, 0.3);
            text-align: center;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo {
            font-size: 1rem;
            font-weight: 300;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.5);
            margin-bottom: 0.5rem;
        }

        .store-name {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 0.25rem;
        }

        .dept-name {
            font-size: 1rem;
            color: rgba(255, 255, 255, 0.6);
            margin-bottom: 2rem;
        }

        /* Status area */
        .status-area {
            min-height: 90px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin-bottom: 1.5rem;
        }

        .status-icon {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
        }

        .status-text {
            font-size: 1.05rem;
            font-weight: 500;
        }

        .consultant-name {
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.65);
            margin-top: 0.25rem;
        }

        /* Spinner */
        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(255, 255, 255, 0.15);
            border-top-color: #6c63ff;
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
            margin: 0 auto 0.75rem;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* Buttons */
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .btn {
            width: 100%;
            padding: 0.8rem 1.5rem;
            border: none;
            border-radius: 14px;
            font-size: 0.95rem;
            font-weight: 600;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .btn:active {
            transform: scale(0.97);
        }

        .btn-primary {
            background: linear-gradient(135deg, #6c63ff, #4facfe);
            color: #fff;
            box-shadow: 0 4px 20px rgba(108, 99, 255, 0.4);
        }

        .btn-primary:hover {
            box-shadow: 0 4px 28px rgba(108, 99, 255, 0.55);
        }

        .btn-warn {
            background: rgba(255, 183, 76, 0.15);
            border: 1px solid rgba(255, 183, 76, 0.4);
            color: #ffb74c;
        }

        .btn-warn:hover {
            background: rgba(255, 183, 76, 0.25);
        }

        .btn-danger {
            background: rgba(255, 82, 82, 0.12);
            border: 1px solid rgba(255, 82, 82, 0.35);
            color: #ff5252;
        }

        .btn-danger:hover {
            background: rgba(255, 82, 82, 0.22);
        }

        .btn-cancel {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: rgba(255, 255, 255, 0.5);
        }

        .btn-cancel:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
        }

        .hidden {
            display: none !important;
        }

        /* Toast */
        .toast {
            position: fixed;
            top: 1.5rem;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(30, 30, 30, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff;
            padding: 0.75rem 1.5rem;
            border-radius: 12px;
            font-size: 0.9rem;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
            z-index: 9999;
            white-space: nowrap;
        }

        .toast.show {
            opacity: 1;
        }


        .error-msg {
            color: #ff6b6b;
            font-size: 0.9rem;
            margin-top: 0.5rem;
        }
    </style>
</head>

<body>
    <div class="card">
        <div class="logo">RetailHub</div>
        <div class="store-name" id="storeName">Загрузка...</div>
        <div class="dept-name" id="deptName"></div>

        <div class="status-area" id="statusArea">
            <div class="spinner" id="initSpinner"></div>
            <div class="status-text">Один момент...</div>
        </div>



        <div class="btn-group" id="btnGroup"></div>
        <div class="error-msg hidden" id="errorMsg"></div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        // ─── State ────────────────────────────────────────────────
        let requestId = null;
        let sessionToken = null;
        let pollInterval = null;
        let remindCooldown = false;

        // ─── Routing: читаем токен из URL ─────────────────────────
        // /scan/{token}  →  location.pathname = "/scan/abcd-1234"
        const pathParts = location.pathname.split('/').filter(Boolean);
        const qrToken = pathParts[pathParts.length - 1];

        // ─── Helpers ──────────────────────────────────────────────
        function showToast(msg, duration = 2800) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), duration);
        }

        function setStatus(icon, text, sub = '') {
            document.getElementById('statusArea').innerHTML = `
      <div class="status-icon">${icon}</div>
      <div class="status-text">${text}</div>
      ${sub ? `<div class="consultant-name">${sub}</div>` : ''}
    `;
        }

        function setButtons(buttons) {
            const g = document.getElementById('btnGroup');
            g.innerHTML = '';
            buttons.forEach(({ label, cls, id, disabled, onClick }) => {
                const b = document.createElement('button');
                b.className = `btn ${cls}`;
                b.id = id || '';
                b.disabled = !!disabled;
                b.innerHTML = label;
                b.addEventListener('click', onClick);
                g.appendChild(b);
            });
        }


        async function api(method, path, body) {
            const res = await fetch(path, {
                method,
                headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
                body: body ? JSON.stringify(body) : undefined,
            });
            if (!res.ok) {
                const err = await res.json().catch(() => ({}));
                throw new Error(err.message || `HTTP ${res.status}`);
            }
            // Безопасно читаем тело: remind/cancel возвращают 200 с пустым телом
            const text = await res.text();
            return text ? JSON.parse(text) : {};
        }

        // ─── Steps ────────────────────────────────────────────────

        // 1. Validate QR token
        async function initQr() {
            try {
                const qr = await api('GET', `/qr-codes/scan/${qrToken}`);
                if (!qr.is_valid) throw new Error('QR-код деактивирован');
                document.getElementById('storeName').textContent = qr.store_name || 'Магазин';
                document.getElementById('deptName').textContent = qr.department_name || '';
                showCallButton();
            } catch (e) {
                document.getElementById('storeName').textContent = 'RetailHub';
                const iconHtml = `<div style="background: rgba(255,255,255,0.05); width: 64px; height: 64px; border-radius: 16px; display: flex; align-items: center; justify-content: center; margin: 0 auto; box-shadow: inset 0 0 0 1px rgba(255,255,255,0.05);">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#ff5252" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="2" width="14" height="20" rx="4" ry="4"></rect><circle cx="12" cy="18" r="1" fill="#ff5252" stroke="none"></circle></svg>
                </div>`;
                setStatus(iconHtml, 'QR-код недействителен', `<span style="color: #ff5252;">${e.message}</span>`);
            }
        }

        // 2. Show initial "Call" button
        function showCallButton() {
            setStatus('🛍️', 'Нужна помощь консультанта?');
            setButtons([{
                label: '🔔 Вызвать консультанта',
                cls: 'btn-primary',
                id: 'callBtn',
                onClick: createRequest,
            }]);
        }

        // 3. Create request
        async function createRequest() {
            document.getElementById('callBtn').disabled = true;
            document.getElementById('callBtn').textContent = 'Создаём заявку...';
            try {
                const data = await api('POST', '/requests', { qr_token: qrToken });
                requestId = data.id;
                sessionToken = data.client_session_token;
                startPolling();
            } catch (e) {
                showToast('Ошибка: ' + e.message);
                document.getElementById('callBtn').disabled = false;
                document.getElementById('callBtn').innerHTML = '🔔 Вызвать консультанта';
            }
        }

        // 4. Polling
        function startPolling() {
            updateStatus();
            pollInterval = setInterval(() => {
                updateStatus();
            }, 5000);
        }

        async function updateStatus() {
            try {
                const d = await api('GET', `/requests/${requestId}?session=${sessionToken}`);
                renderState(d);
            } catch (e) {
                console.warn('Poll error:', e);
            }
        }

        function renderState(d) {
            const status = d.status;

            if (status === 'CREATED' || status === 'WAITING') {
                setStatus('⏳', 'Ищем свободного консультанта…', 'Ожидайте, пожалуйста');
                setButtons([{
                    label: '❌ Отменить вызов',
                    cls: 'btn-cancel',
                    onClick: cancelReq,
                }]);
            }

            else if (status === 'ESCALATED') {
                setStatus('⚠️', 'Долгое ожидание', 'Менеджер уже в курсе');
                setButtons([{
                    label: '❌ Отменить вызов',
                    cls: 'btn-cancel',
                    onClick: cancelReq,
                }]);
            }

            else if (status === 'ASSIGNED') {
                const name = d.consultant_name || 'Консультант';
                setStatus('🧑‍💼', 'Консультант идёт к вам!', name);
                const btns = [];
                if (d.can_remind) {
                    btns.push({
                        label: '📣 Напомнить консультанту',
                        cls: 'btn-warn',
                        id: 'remindBtn',
                        disabled: remindCooldown,
                        onClick: sendRemind,
                    });
                }
                if (d.can_reassign) {
                    btns.push({
                        label: '🔄 Заменить консультанта',
                        cls: 'btn-danger',
                        onClick: () => reassignReq(),
                    });
                }
                if (!d.can_reassign) {
                    btns.push({
                        label: '❌ Отменить вызов',
                        cls: 'btn-cancel',
                        onClick: cancelReq,
                    });
                }
                setButtons(btns);
            }

            else if (status === 'COMPLETED') {
                clearInterval(pollInterval);
                setStatus('✅', 'Обслуживание завершено', 'Спасибо за визит!');
                setButtons([]);
            }

            else if (status === 'CANCELED') {
                clearInterval(pollInterval);
                setStatus('🚫', 'Вызов отменён');
                setButtons([{
                    label: '🔔 Вызвать снова',
                    cls: 'btn-primary',
                    onClick: () => { requestId = null; sessionToken = null; showCallButton(); },
                }]);
            }
        }

        // ─── Actions ──────────────────────────────────────────────

        async function cancelReq() {
            try {
                await api('POST', `/requests/${requestId}/cancel?session=${sessionToken}`);
                clearInterval(pollInterval);
                setStatus('🚫', 'Вызов отменён');
                setButtons([{
                    label: '🔔 Вызвать снова',
                    cls: 'btn-primary',
                    onClick: () => { requestId = null; sessionToken = null; showCallButton(); },
                }]);
            } catch (e) {
                showToast('Ошибка: ' + e.message);
            }
        }

        async function sendRemind() {
            try {
                await api('POST', `/requests/${requestId}/remind?session=${sessionToken}`);
                showToast('📣 Напоминание отправлено консультанту!');
                remindCooldown = true;
                const btn = document.getElementById('remindBtn');
                if (btn) { btn.disabled = true; btn.textContent = '✓ Отправлено'; }
                setTimeout(() => { remindCooldown = false; }, 60000); // 1 мин cooldown
            } catch (e) {
                showToast('Ошибка: ' + e.message);
            }
        }

        async function reassignReq() {
            try {
                await api('POST', `/requests/${requestId}/reassign?session=${sessionToken}`, { reason: 'Долго не подходит' });
                showToast('🔄 Запрос на замену отправлен');
                remindCooldown = false;
            } catch (e) {
                showToast('Ошибка: ' + e.message);
            }
        }

        // ─── Boot ─────────────────────────────────────────────────
        if (!qrToken || qrToken === 'index.html') {
            // Открыт напрямую /scan/index.html без токена — показываем заглушку
            document.getElementById('storeName').textContent = 'RetailHub';
            document.getElementById('deptName').textContent = 'Клиентский портал';
            setStatus('📱', 'Отсканируйте QR-код в магазине', 'Эта страница открывается автоматически');
            setButtons([]);
        } else {
            initQr();
        }
    </script>
</body>

</html>
