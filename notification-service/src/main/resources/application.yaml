server:
  port: 8085

spring:
  application:
    name: notification-service
  jackson:
    property-naming-strategy: SNAKE_CASE

  datasource:
    url: jdbc:postgresql://postgres:5432/notification_db
    username: ${DB_USERNAME:retailhub}
    password: ${DB_PASSWORD:retailhub}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
    consumer:
      group-id: notification-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

fcm:
  # Путь до service-account JSON из Firebase Console.
  # Поддерживаются префиксы Spring: file:/... или classpath:...
  # Если свойство пустое — FCM отключён и push-и только логируются (dev-режим).
  credentials-location: ${FCM_CREDENTIALS_LOCATION:}

app:
  jwt:
    secret: ${APP_JWT_SECRET:beAxeaveJiJRK6CIwR_bp-DxQAH9BBRWkv5HfhZOVHVU4JWGA6MFSndFPFd_lE7keRxVpNcuKfopDNeBMfJRBQ}

logging:
  level:
    ru.retailhub.notification: DEBUG
    org.springframework.kafka: INFO
